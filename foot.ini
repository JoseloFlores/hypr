# Foot — configuración principal
# Colores vía Noctalia (user-template foot → themes/noctalia, lo añade el hook).

[main]
font=MesloLGM Nerd Font Mono:size=9, JetBrainsMono Nerd Font:size=9, monospace:size=9
pad=8x8 center
dpi-aware=yes
initial-window-size-pixels=700x500
resize-delay-ms=100

[scrollback]
lines=1000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=no
