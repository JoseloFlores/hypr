# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

xwayland {
    force_zero_scaling = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = intl
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
#bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, X, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, C, exec, $browser 
bind = $mainMod, Z, exec, spotify 
# Power button bind
bind = $mainMod, L, exec, ~/.config/hypr/power_menu.sh 

# Refrescar Barra y Sincronizar Colores
bind = $mainMod SHIFT, B, exec, bash -c "~/.config/hypr/eww_restart.sh"

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# See https://wiki.hypr.land/Configuring/Keywords/

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Custom multimedia keybindings (Ctrl + Alt) - Globales
bindel = CTRL ALT, n, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = CTRL ALT, m, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindl = CTRL ALT, comma, exec, playerctl previous
bindl = CTRL ALT, period, exec, playerctl next
bindl = CTRL ALT, slash, exec, playerctl play-pause


# Lid switch bind - Bloquea cuando se cierra la tapa
bindl=,switch:on:Lid Switch,exec,loginctl lock-session && sleep 1 && hyprctl dispatch dpms off
# Lid switch bind - Enciende pantalla al abrir la tapa
bindl=,switch:off:Lid Switch,exec,hyprctl dispatch dpms on

# --- Screenshots ---
# Directorio portable: respeta XDG_PICTURES_DIR (xdg-user-dir) o fallback ~/Pictures/~/Imágenes
# Hyprland no expande $(...), por eso los binds usan expansión shell directa
$screenshotDir = ~/Pictures/Capturas

# Seleccionar Área o Monitor (Click en un monitor para capturarlo entero)
bind = , Print, exec, bash -c 'DIR="$(xdg-user-dir PICTURES 2>/dev/null || echo "$HOME/Pictures")/Capturas"; [ -d "$HOME/Imágenes" ] && [ ! -d "$DIR" ] && DIR="$HOME/Imágenes/Capturas"; mkdir -p "$DIR" && grim -g "$(slurp)" - | swappy -f -'

# Capturar ventana activa
bind = ALT, Print, exec, bash -c 'DIR="$(xdg-user-dir PICTURES 2>/dev/null || echo "$HOME/Pictures")/Capturas"; [ -d "$HOME/Imágenes" ] && [ ! -d "$DIR" ] && DIR="$HOME/Imágenes/Capturas"; mkdir -p "$DIR" && active_window_geo=$(hyprctl activewindow -j | jq -r "\"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])\"") && if [ "$active_window_geo" != "null,null nullxnull" ]; then grim -g "$active_window_geo" - | swappy -f -; else notify-send "Captura" "No hay una ventana activa para capturar"; fi'

# Capturar monitor actual (donde esté el foco)
bind = $mainMod, Print, exec, bash -c 'DIR="$(xdg-user-dir PICTURES 2>/dev/null || echo "$HOME/Pictures")/Capturas"; [ -d "$HOME/Imágenes" ] && [ ! -d "$DIR" ] && DIR="$HOME/Imágenes/Capturas"; mkdir -p "$DIR" && grim -o $(hyprctl monitors -j | jq -r ".[] | select(.focused) | .name") - | swappy -f -'


# --- Screen Recording (Videos) ---
$videoDir = ~/Pictures/Capturas
$notifyVideo = notify-send -e -u low -i video-x-generic "Grabador de Pantalla"

# Grabar un área seleccionada (Iniciar / Parar) — portable XDG
bind = SHIFT, Print, exec, bash -c 'DIR="$(xdg-user-dir PICTURES 2>/dev/null || echo "$HOME/Pictures")/Capturas"; [ -d "$HOME/Imágenes" ] && [ ! -d "$DIR" ] && DIR="$HOME/Imágenes/Capturas"; mkdir -p "$DIR" && notify-send -e -u low -i video-x-generic "Grabador de Pantalla" "Grabación iniciada (Área)" && wf-recorder -g "$(slurp)" -f "$DIR/Video_$(date +%Y%m%d_%H%M%S).mp4" && notify-send -e -u low -i video-x-generic "Grabador de Pantalla" "Grabación guardada en $DIR"'

# Grabar pantalla completa (Iniciar / Parar) — portable XDG
bind = CTRL, Print, exec, bash -c 'DIR="$(xdg-user-dir PICTURES 2>/dev/null || echo "$HOME/Pictures")/Capturas"; [ -d "$HOME/Imágenes" ] && [ ! -d "$DIR" ] && DIR="$HOME/Imágenes/Capturas"; mkdir -p "$DIR" && notify-send -e -u low -i video-x-generic "Grabador de Pantalla" "Grabación iniciada (Pantalla Completa)" && wf-recorder -f "$DIR/Video_$(date +%Y%m%d_%H%M%S).mp4" && notify-send -e -u low -i video-x-generic "Grabador de Pantalla" "Grabación guardada en $DIR"'

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = float-network
    match:class = com.github.adw-network
    float = yes
}

windowrule {
    name = float-calendar
    match:class = gnome-calendar
    float = yes
    size = 400 300
    center = yes
}

windowrule {
    name = float-bluetooth
    match:class = blueman-manager
    float = yes
}

windowrule {
    name = float-audio
    match:class = pavucontrol
    float = yes
}

