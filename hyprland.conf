################
### MONITORS ###
################

# NOTA PORTABILIDAD: Este bloque es EJEMPLO del autor (DP-3 1080p arriba + eDP-1 2560x1600@2x abajo).
# Para cualquier otro usuario/hardware, edita o comenta estas dos líneas y deja solo el fallback.
# Ver nombres/resoluciones reales con: hyprctl monitors
# monitor=NOMBRE, RESOLUCION, POSICION, ESCALA

# 1. Monitor Externo (DP-3) - Arriba [EJEMPLO - ajusta a tu monitor]
monitor=DP-3, 1920x1080, 0x0, 1

# 2. Pantalla Notebook (eDP-1) - Abajo y Centrada [EJEMPLO]
# El monitor externo tiene 1920 de ancho. La laptop tiene 2560 de ancho pero escala 2 (1280 lógico).
# Para centrar: (1920 - 1280) / 2 = 320.
monitor=eDP-1, 2560x1600, 320x1080, 2

# 3. REGLA GENÉRICA (Fallback portable — funciona para cualquier monitor/TV)
# Aplica a cualquier pantalla no listada arriba. Usa su resolución nativa y la posiciona automáticamente.
monitor=, preferred, auto, 1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
# $terminal = gnome-terminal
$terminal = foot
$fileManager = nautilus
$menu = fuzzel
$browser = firefox-esr

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = ~/.config/hypr/eww_start.sh
exec-once = swaybg -i ~/.config/hypr/wallpaper.jpg -m fill

# GNOME comforts sin Mutter — polkit, keyring, automontaje, BT, notificaciones
exec-once = systemctl --user start hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec-once = hypridle
exec-once = udiskie -t &
exec-once = blueman-applet &
exec-once = swaync &
exec-once = wl-paste --watch cliphist store &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

