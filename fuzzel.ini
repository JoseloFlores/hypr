# Fuzzel — colores vía Noctalia (user-template fuzzel → themes/noctalia).
# No editar colores a mano.
include=~/fuzzel/themes/noctalia

[main]
font=MesloLGM Nerd Font Mono:size=11, JetBrainsMono Nerd Font:size=11, monospace:size=11
use-bold=no
dpi-aware=auto
prompt="> "
icon-theme=Gruvbox-Plus-Dark
icons-enabled=yes
hide-before-typing=no
fields=filename,name,generic
match-mode=fzf
sort-result=yes
match-counter=no
terminal=foot
width=30
lines=15
horizontal-pad=40
vertical-pad=8
inner-pad=4
anchor=center
layer=overlay

# (colores en themes/noctalia, el template añade el include)

[border]
width=1
radius=12

[dmenu]
mode=text
