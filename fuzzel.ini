# Fuzzel — plantilla base (tema sincronizado vía foot_sync.sh)
# Fuente de verdad: ~/.config/waybar/themes/<nombre>.css
# Este archivo se sincroniza automáticamente con el tema Waybar activo (ash-dark por defecto).
# No edites [colors]/[border] manualmente — se sobreescriben con translucidez e6.

[main]
font=MesloLGM Nerd Font Mono:size=11, JetBrainsMono Nerd Font:size=11, monospace:size=11
use-bold=no
dpi-aware=auto
prompt="> "
icon-theme=Gruvbox-Plus-Dark
icons-enabled=yes
hide-before-typing=no
fields=filename,name,generic
match-mode=fzf
sort-result=yes
match-counter=no
terminal=foot
width=30
lines=15
horizontal-pad=40
vertical-pad=8
inner-pad=4
anchor=center
layer=overlay

[colors]
# Translúcido: background con alpha e6 (~90% opaco) para ver blur de Hyprland
background=15171ee6
text=c8c9d1ff
prompt=c8c9d1ff
placeholder=c8c9d180
input=c8c9d1ff
match=7d8ac2ff
selection=7d8ac2ff
selection-text=15171eff
selection-match=c8c9d1ff
counter=c8c9d180
border=7d8ac2ff

[border]
width=1
radius=12

[dmenu]
mode=text
